# StoryMaker — Voice HAT de Google (kit AIY V1) con Raspberry Pi 3
# Misma estructura que storymaker_pcb.conf. La tarjeta va por nombre porque en
# la Pi 3 el jack (card 0) y el HDMI ocupan otros números. El HAT sólo acepta
# S32_LE a 48000 Hz y no tiene mezclador propio: el volumen lo pone mpg123.
pcm.dmixed {
    type dmix
    ipc_key 1024
    ipc_key_add_uid true
    slave {
        pcm "hw:CARD=sndrpigooglevoi,DEV=0"
        rate 48000
        format S32_LE
        period_time 0
        period_size 1024
        buffer_size 8192
    }
    bindings {
        0 0
        1 1
    }
}
ctl.dmixed {
    type hw
    card sndrpigooglevoi
}
