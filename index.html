st fb  = document.getElementById('generar-fb');\n  btn.disabled = true;\n  fb.textContent = 'Generando...';\n  try {\n    const r = await fetch('/api/generar', {method:'POST',\n      headers:{'Content-Type':'application/json'}, body:'{}'});\n    const d = await r.json();\n    if (d.ok) {\n      fb.textContent = 'Premisa enviada a las salidas activas.';\n      setTimeout(() => consultarPremisa(true), 400);\n      setTimeout(() => consultarPremisa(true), 1200);\n    } else {\n      fb.textContent = d.error || 'Error al generar.';\n    }\n  } catch(e) {\n    fb.textContent = 'Error de conexión.';\n  }\n  setTimeout(() => {\n    btn.disabled = false;\n    fb.textContent = '';\n  }, 3000);\n}\n// Perfil confirmado por la caja. El selector ya muestra el nuevo; la etiqueta\n// «activo» de la barra lateral se movía solo al recargar la página.\nvar _perfilActivo = (document.getElementById('perfil-sel') || {}).value;\nasync function cambiarPerfil(p) {\n  const sel = document.getElementById('perfil-sel');\n  let d = {ok: false};\n  try {\n    const r = await fetch('/api/cambiar_perfil', {\n      method:'POST', headers:{'Content-Type':'application/json'},\n      body: JSON.stringify({perfil: p})\n    });\n    d = await r.json();\n  } catch (e) {\n    d.error = 'Sin respuesta de la caja';\n  }\n  if (!d.ok) {\n    if (sel) sel.value = _perfilActivo;\n    alert('No se ha podido cambiar el perfil activo' + (d.error ? ': ' + d.error : '.'));\n    return;\n  }\n  _perfilActivo = p;\n  document.querySelectorAll('.nav-perfil .badge-activo').forEach(b => b.remove());\n  const enlace = document.querySelector('.nav-perfil[data-perfil=\"' + CSS.escape(p) + '\"]');\n  if (enlace) {\n    const b = document.createElement('span');\n    b.className = 'badge-activo';\n    b.textContent = 'activo';\n    enlace.appendChild(b);\n  }\n  if (sel) {\n    sel.style.outline = '2px solid #9be6a8';\n    setTimeout(() => sel.style.outline = '', 1400);\n  }\n}\nasync function confirmarApagado() {\n  if (!confirm('¿Apagar el dispositivo?')) return;\n  const btn = document.querySelector('.hlink-apagar');\n  btn.disabled = true;\n  btn.textContent = 'Apagando...';\n  await fetch('/api/apagar', {method:'POST',\n    headers:{'Content-Type':'application/json'}, body:'{}'});\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>", "perfil_conflictos": "\u003c!DOCTYPE html>\n\u003chtml lang=\"es\">\n\u003chead>\u003cscript>\n(function () {\n  var sim = parent.__sim;\n  window.fetch = function (u, o) { return sim.fetch(String(u), o || {}); };\n  document.addEventListener('click', function (e) {\n    var a = e.target.closest && e.target.closest('a[href]');\n    if (!a || a.target === '_blank') return;\n    var h = a.getAttribute('href');\n    if (/^(https?:|mailto:|#)/.test(h)) return;\n    e.preventDefault(); sim.ir(h);\n  });\n  document.addEventListener('submit', function (e) {\n    e.preventDefault(); sim.formulario(e.target);\n  });\n})();\n\u003c/script>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1\">\n\u003cmeta name=\"theme-color\" content=\"#2c2416\">\n\u003cmeta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n\u003ctitle>Panel — StoryMaker\u003c/title>\n__SIM_FONTS__\n\u003cstyle>\n\n:root {\n  --paper:   #faf7f2;\n  --paper2:  #f3ede3;\n  --ink:     #2c2416;\n  --ink2:    #5a5040;\n  --accent:  #8b3a1c;\n  --accent2: #b85c35;\n  --border:  #ddd6c8;\n  --border2: #c8bfb0;\n  --ok:      #2d6a3f;\n  --ok-bg:   #eaf3ec;\n  --err:     #8b1c1c;\n  --err-bg:  #f9eaea;\n  --white:   #ffffff;\n  --shadow:  rgba(44,36,22,0.08);\n  --serif:   'Lora', Georgia, serif;\n  --sans:    'Inter', system-ui, sans-serif;\n}\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml { font-size: 16px; -webkit-text-size-adjust: 100%; }\nbody { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; }\na { text-decoration: none; color: inherit; }\nbutton, input, select, textarea { font-family: inherit; }\n\n\n.serif { font-family: var(--serif); }\n.muted { color: var(--ink2); }\n.accent { color: var(--accent); }\n.badge-activo {\n  display: inline-block;\n  font-size: .65rem; font-weight: 500;\n  text-transform: uppercase; letter-spacing: .06em;\n  background: var(--accent); color: #fff;\n  padding: .15rem .45rem;\n  vertical-align: middle; margin-left: .4rem;\n}\n.tag {\n  display: inline-flex; align-items: center; gap: .3rem;\n  font-size: .72rem; font-weight: 500;\n  text-transform: uppercase; letter-spacing: .06em;\n  color: var(--ink2); background: var(--paper2);\n  border: 1px solid var(--border); padding: .2rem .55rem;\n}\n.tag.on  { background: #eaf3ec; color: var(--ok);  border-color: #b8d9c2; }\n.tag.off { background: #f5f5f5; color: #aaa;       border-color: #e0e0e0; }\n.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }\n.dot.on  { background: var(--ok); }\n.dot.off { background: #ccc; }\n\n\n/* ── Layout general ── */\nbody { display: flex; flex-direction: column; }\n\n/* ── Header ── */\n.header {\n  background: var(--ink); color: var(--white);\n  padding: .85rem 1.25rem;\n  display: flex; align-items: center; justify-content: space-between;\n  flex-wrap: wrap; gap: .6rem;\n  border-bottom: 3px solid var(--accent);\n  position: sticky; top: 0; z-index: 100;\n}\n.header-logo {\n  font-family: var(--serif); font-size: 1.3rem; font-weight: 600; line-height: 1;\n}\n.header-logo em { color: var(--accent2); font-style: italic; }\n.header-ver {\n  font-family: var(--sans); font-size: .68rem; letter-spacing: .04em;\n  color: #888; margin-left: .35rem; vertical-align: middle;\n}\n.hlink-nueva { color: var(--accent2); }\n.hlink-nueva::after {\n  content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%;\n  background: var(--accent2); margin-left: .3rem; vertical-align: 2px;\n}\n.header-right { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }\n.hw-tags { display: flex; gap: .35rem; flex-wrap: wrap; }\n.header-right .tag { border-color: rgba(255,255,255,.15); }\n.header-right .tag.on  { background: rgba(45,106,63,.35); color: #9be6a8; border-color: rgba(155,230,168,.3); }\n.header-right .tag.off { background: rgba(255,255,255,.06); color: #888; border-color: rgba(255,255,255,.1); }\n.header-right .dot.on  { background: #9be6a8; }\n.header-right .dot.off { background: #555; }\n\n.vol-inline { display: flex; align-items: center; gap: .4rem; }\n.vol-inline input[type=range] { width: 70px; accent-color: var(--accent2); cursor: pointer; }\n.vol-inline span { font-size: .75rem; color: #aaa; min-width: 2rem; }\n\n.perfil-sel-wrap { display: flex; align-items: center; gap: .4rem; }\n.perfil-sel-wrap label { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: #888; }\n.perfil-sel-wrap select {\n  background: rgba(255,255,255,.08); color: var(--white);\n  border: 1px solid rgba(255,255,255,.2);\n  padding: .3rem .6rem; font-size: .82rem; cursor: pointer; outline: none;\n}\n.perfil-sel-wrap select option { background: var(--ink); }\n\n.header-links { display: flex; gap: .5rem; }\n.hlink {\n  font-size: .75rem; text-transform: uppercase; letter-spacing: .06em;\n  color: #888; padding: .3rem .5rem; transition: color .15s;\n}\n.hlink:hover { color: var(--accent2); }\n.hlink-apagar {\n  background: none; border: none; cursor: pointer;\n}\n.hlink-apagar:hover { color: #e05c5c; }\n\n/* ── Layout main ── */\n.main-layout { display: flex; flex: 1; min-height: 0; }\n\n/* ── Sidebar ── */\n.sidebar {\n  width: 200px; flex-shrink: 0;\n  background: var(--white); border-right: 1.5px solid var(--border);\n  padding: 1.25rem 0;\n  display: flex; flex-direction: column;\n}\n.sidebar-label {\n  font-size: .68rem; font-weight: 500; text-transform: uppercase;\n  letter-spacing: .1em; color: var(--ink2);\n  padding: 0 1rem; margin-bottom: .6rem;\n}\n.nav-perfil {\n  display: block; padding: .65rem 1rem;\n  font-size: .88rem; font-weight: 500; color: var(--ink);\n  border-left: 3px solid transparent;\n  transition: background .12s, border-color .12s;\n}\n.nav-perfil:hover  { background: var(--paper2); border-left-color: var(--border2); }\n.nav-perfil.activo { background: var(--paper2); border-left-color: var(--accent); color: var(--accent); }\n.nav-empty { padding: .65rem 1rem; font-size: .82rem; color: var(--ink2); font-style: italic; }\n.sidebar-footer { margin-top: auto; padding: 1rem; border-top: 1px solid var(--border); }\n.nuevo-perfil-btn {\n  font-size: .75rem; font-weight: 500; text-transform: uppercase; letter-spacing: .06em;\n  color: var(--ink2); background: none; border: 1px dashed var(--border2);\n  padding: .45rem .75rem; cursor: pointer; width: 100%; transition: color .12s, border-color .12s;\n}\n.nuevo-perfil-btn:hover { color: var(--accent); border-color: var(--accent); }\n.nuevo-perfil-crear {\n  font-size: .78rem; font-weight: 500; padding: .45rem .9rem;\n  background: var(--ink); color: var(--white); border: none; cursor: pointer;\n}\n.nuevo-perfil-crear:hover { background: var(--accent); }\n\n/* ── Contenido ── */\n.contenido { flex: 1; padding: 1.5rem; overflow-y: auto; }\n\n/* ── Tabs ── */\n.tabs { display: flex; gap: .5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }\n.tab {\n  display: inline-flex; align-items: center; gap: .4rem;\n  padding: .5rem .9rem; font-size: .82rem; font-weight: 500;\n  border: 1.5px solid var(--border); color: var(--ink2);\n  background: var(--white); transition: all .12s;\n}\n.tab:hover { border-color: var(--ink); color: var(--ink); }\n.tab.activo { border-color: var(--ink); background: var(--ink); color: var(--white); }\n.tab-count {\n  font-size: .72rem; background: rgba(255,255,255,.18);\n  padding: .1rem .4rem; min-width: 1.5rem; text-align: center;\n}\n.tab:not(.activo) .tab-count { background: var(--paper2); color: var(--ink2); }\n\n/* ── Premisas ── */\n.premisas-card { background: var(--white); border: 1.5px solid var(--border); }\n.premisas-header {\n  padding: 1rem 1.25rem;\n  border-bottom: 1px solid var(--border);\n  display: flex; align-items: center; justify-content: space-between;\n}\n.premisas-title { font-size: 1.2rem; font-weight: 600; }\n.premisas-total {\n  font-size: .75rem; color: var(--ink2);\n  background: var(--paper2); border: 1px solid var(--border);\n  padding: .2rem .6rem;\n}\n.premisas-head-right { display: flex; align-items: center; gap: .6rem; }\n.imp-link {\n  font-size: .75rem; color: var(--ink2); white-space: nowrap;\n  border: 1px solid var(--border2); padding: .25rem .6rem;\n  transition: color .12s, border-color .12s;\n}\n.imp-link:hover { color: var(--accent); border-color: var(--accent); }\n.premisas-lista { list-style: none; max-height: 340px; overflow-y: auto; }\n.premisa-item {\n  display: flex; align-items: baseline; gap: .7rem;\n  padding: .65rem 1.25rem; border-bottom: 1px solid var(--paper2);\n  transition: background .1s;\n}\n.premisa-item:hover { background: var(--paper); }\n.premisa-num { font-size: .7rem; color: var(--ink2); min-width: 1.4rem; text-align: right; flex-shrink: 0; }\n.premisa-texto { flex: 1; font-size: .88rem; line-height: 1.5; color: var(--ink); }\n.premisa-del {\n  background: none; border: none; cursor: pointer;\n  color: var(--border2); padding: .2rem; flex-shrink: 0;\n  transition: color .12s;\n}\n.premisa-del:hover { color: var(--accent); }\n.premisa-vacia {\n  padding: 2rem 1.25rem; text-align: center;\n  font-style: italic; color: var(--ink2); font-size: .88rem;\n}\n\n/* ── Añadir ── */\n.anadir-area { padding: 1.1rem 1.25rem; border-top: 2px solid var(--border); background: var(--paper); }\n.anadir-label {\n  font-size: .7rem; font-weight: 500; text-transform: uppercase;\n  letter-spacing: .08em; color: var(--ink2); margin-bottom: .6rem;\n}\n.anadir-area textarea {\n  width: 100%; padding: .75rem .9rem;\n  border: 1.5px solid var(--border); background: var(--white);\n  font-size: .9rem; line-height: 1.55; resize: vertical;\n  color: var(--ink); outline: none; transition: border-color .15s;\n}\n.anadir-area textarea:focus { border-color: var(--accent); }\n.anadir-actions { display: flex; align-items: center; gap: .75rem; margin-top: .6rem; }\n.anadir-btn {\n  padding: .6rem 1.25rem; background: var(--ink); color: var(--white);\n  border: none; font-size: .82rem; font-weight: 500;\n  text-transform: uppercase; letter-spacing: .06em;\n  cursor: pointer; transition: background .12s; white-space: nowrap;\n}\n.anadir-btn:hover { background: var(--accent); }\n.fb { font-size: .82rem; }\n.fb.ok  { color: var(--ok); }\n.fb.err { color: var(--err); }\n\n/* ── Bienvenida / placeholders ── */\n.bienvenida {\n  padding: 3.5rem 2rem; text-align: center;\n  max-width: 420px; margin: 0 auto;\n}\n.bienvenida-title {\n  font-size: 1.25rem; font-style: italic; color: var(--ink2);\n  margin-bottom: .9rem; line-height: 1.5;\n}\n.bienvenida-sub { font-size: .87rem; color: var(--ink2); line-height: 1.6; }\n.selecciona-tipo {\n  padding: 3rem 1.5rem; text-align: center;\n  font-style: italic; color: var(--ink2); font-size: .9rem;\n}\n\n/* ── Barra GENERAR ── */\n.generar-bar {\n  background: var(--accent);\n  padding: .75rem 1.25rem;\n  display: flex; align-items: center; gap: 1rem;\n  border-bottom: 2px solid #6b2a12;\n}\n.generar-btn {\n  font-family: var(--serif); font-size: 1.05rem; font-weight: 600;\n  letter-spacing: .08em;\n  background: var(--white); color: var(--accent);\n  border: none; padding: .65rem 2rem;\n  cursor: pointer; transition: background .12s, transform .1s;\n  white-space: nowrap;\n  box-shadow: 3px 3px 0 rgba(0,0,0,.2);\n}\n.generar-btn:hover  { background: var(--paper); }\n.generar-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 rgba(0,0,0,.2); }\n.generar-btn:disabled {\n  opacity: .6; cursor: not-allowed;\n  transform: none; box-shadow: 3px 3px 0 rgba(0,0,0,.2);\n}\n.generar-fb {\n  font-size: .82rem; color: rgba(255,255,255,.85);\n  font-style: italic; flex: 1;\n  min-height: 1.2em;\n}\n@media (max-width: 640px) {\n  .generar-bar { padding: .65rem 1rem; }\n  .generar-btn { padding: .6rem 1.4rem; font-size: .95rem; }\n}\n\n/* ── Mobile: menú lateral colapsado ── */\n@media (max-width: 640px) {\n  .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; padding: .6rem .75rem; border-right: none; border-bottom: 1.5px solid var(--border); }\n  .sidebar-label { width: 100%; margin-bottom: .35rem; }\n  .nav-perfil { border-left: none; border-bottom: 3px solid transparent; padding: .45rem .75rem; font-size: .82rem; }\n  .nav-perfil.activo { border-bottom-color: var(--accent); border-left-color: transparent; }\n  .sidebar-footer { border-top: none; border-left: 1px solid var(--border); padding: .45rem .75rem; margin-top: 0; }\n  .nuevo-perfil-btn { white-space: nowrap; }\n  .main-layout { flex-direction: column; }\n  .contenido { padding: 1rem; }\n  .header { padding: .75rem 1rem; }\n  .hw-tags { display: none; } /* ocultar en móvil pequeño */\n  .hlink { padding: .3rem .3rem; }\n  .premisas-lista { max-height: 260px; }\n  .tabs { gap: .35rem; }\n  .tab { padding: .45rem .7rem; font-size: .78rem; }\n}\n\n/* ── Lámina: la premisa recién generada, a toda página ── */\n.lamina {\n  position: fixed; inset: 0; z-index: 200;\n  display: flex; align-items: center; justify-content: center;\n  padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));\n  background: rgba(44, 36, 22, .62);\n  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);\n  animation: lamina-fondo .35s ease-out;\n}\n.lamina[hidden] { display: none; }\n.lamina-hoja {\n  position: relative; width: 100%; max-width: 46rem; max-height: 100%; overflow-y: auto;\n  background: var(--paper);\n  background-image: radial-gradient(ellipse at 50% 0%, #fffdf8 0%, var(--paper) 55%, var(--paper2) 100%);\n  padding: clamp(2.2rem, 7vw, 4.5rem) clamp(1.5rem, 7vw, 5rem) clamp(1.8rem, 5vw, 3rem);\n  text-align: center;\n  box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .35);\n  animation: lamina-hoja .5s cubic-bezier(.2, .7, .2, 1);\n}\n/* Doble filete, como el marco de una portadilla */\n.lamina-hoja::before, .lamina-hoja::after {\n  content: ''; position: absolute; pointer-events: none;\n  border: 1px solid rgba(139, 58, 28, .28);\n}\n.lamina-hoja::before { inset: .65rem; }\n.lamina-hoja::after  { inset: .95rem; border-color: rgba(139, 58, 28, .14); }\n.lamina-cabecera {\n  font-size: .72rem; font-weight: 500; letter-spacing: .28em; text-transform: uppercase;\n  color: var(--accent); margin-bottom: 1.4rem;\n}\n.lamina-comilla {\n  display: block; font-family: var(--serif); font-size: clamp(4rem, 12vw, 6.5rem);\n  line-height: .55; color: var(--accent); opacity: .32; margin-bottom: .35rem;\n}\n.lamina-texto {\n  font-family: var(--serif); font-weight: 400; color: var(--ink);\n  font-size: clamp(1.55rem, 4.8vw, 2.65rem); line-height: 1.38;\n  text-wrap: balance; hyphens: manual;\n  animation: lamina-texto .9s ease-out .15s both;\n}\n.lamina-orla {\n  font-family: var(--serif); color: var(--accent); opacity: .75;\n  font-size: 1.5rem; margin: 1.6rem 0 1.4rem;\n}\n.lamina-acciones { display: flex; gap: .6rem 1.4rem; justify-content: center; align-items: center; flex-wrap: wrap; }\n.lamina-otra {\n  font-family: var(--serif); font-size: 1rem; font-weight: 600; letter-spacing: .06em;\n  background: var(--ink); color: var(--white); border: none;\n  padding: .7rem 1.8rem; cursor: pointer; transition: background .12s;\n}\n.lamina-otra:hover { background: var(--accent); }\n.lamina-otra:disabled { opacity: .55; cursor: wait; }\n.lamina-cerrar {\n  background: none; border: none; cursor: pointer; padding: .5rem;\n  font-size: .85rem; color: var(--ink2); text-decoration: underline; text-underline-offset: 3px;\n}\n.lamina-cerrar:hover { color: var(--accent); }\n/* Aviso (p. ej. combinaciones agotadas): sin comilla y a menor tamaño */\n.lamina.aviso .lamina-comilla { display: none; }\n.lamina.aviso .lamina-texto { font-size: clamp(1.15rem, 3.4vw, 1.6rem); font-style: italic; }\n@keyframes lamina-fondo { from { opacity: 0; } }\n@keyframes lamina-hoja  { from { opacity: 0; transform: translateY(18px) scale(.985); } }\n@keyframes lamina-texto { from { opacity: 0; letter-spacing: .015em; } }\n@media (prefers-reduced-motion: reduce) {\n  .lamina, .lamina-hoja, .lamina-texto { animation: none; }\n}\n\n\u003c/style>\n\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"header-logo\">Story\u003cem>Maker\u003c/em>\u003cspan class=\"header-ver\">v1.0.1\u003c/span>\u003c/div>\n  \u003cdiv class=\"header-right\">\n    \u003cdiv class=\"hw-tags\">\u003cspan class=\"tag on\">\u003cspan class=\"dot on\">\u003c/span>E-ink\u003c/span>\u003cspan class=\"tag on\">\u003cspan class=\"dot on\">\u003c/span>Impresora\u003c/span>\u003cspan class=\"tag on\">\u003cspan class=\"dot on\">\u003c/span>Audio\u003c/span>\u003c/div>\n    \n\u003cdiv class=\"vol-inline\">\n  \u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" style=\"color:#888\">\u003cpolygon points=\"11,5 6,9 2,9 2,15 6,15 11,19\"/>\u003cpath d=\"M15.5 8.5a5 5 0 0 1 0 7\"/>\u003cpath d=\"M19 5a9 9 0 0 1 0 14\"/>\u003c/svg>\n  \u003cinput type=\"range\" min=\"0\" max=\"100\" value=\"80\" step=\"1\"\n         id=\"vol-slider\" oninput=\"debounceVol(this.value)\">\n  \u003cspan id=\"vol-display\">80%\u003c/span>\n\u003c/div>\n    \u003cdiv class=\"perfil-sel-wrap\">\n      \u003clabel for=\"perfil-sel\">Perfil activo\u003c/label>\n      \u003cselect id=\"perfil-sel\" onchange=\"cambiarPerfil(this.value)\">\u003coption value=\"simperfilx\" selected>SIMPERFILX\u003c/option>\u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"header-links\">\n      \u003ca href=\"/setup\" class=\"hlink\">⚙ Hardware\u003c/a>\n      \u003ca href=\"/actualizar\" class=\"hlink\"\n         title=\"Versión del firmware y actualizaciones\">⟳ Actualizar\u003c/a>\n      \u003cbutton class=\"hlink hlink-apagar\" onclick=\"confirmarApagado()\" title=\"Apagar el dispositivo\">\n        \u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" style=\"vertical-align:-2px\">\u003cpath d=\"M18.4 6.6a9 9 0 1 1-12.77.04\"/>\u003cline x1=\"12\" y1=\"2\" x2=\"12\" y2=\"12\"/>\u003c/svg>\n        Apagar\n      \u003c/button>\n      \u003ca href=\"/logout\" class=\"hlink\">Salir\u003c/a>\n    \u003c/div>\n  \u003c/div>\n\u003c/header>\n\u003cdiv class=\"generar-bar\">\n  \u003cbutton class=\"generar-btn\" id=\"generar-btn\" onclick=\"generarPremisa()\">\n    \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\"\n         stroke=\"currentColor\" stroke-width=\"2.5\" style=\"vertical-align:-3px;margin-right:.5rem\">\n      \u003cpolygon points=\"5,3 19,12 5,21\"/>\n    \u003c/svg>\n    GENERAR\n  \u003c/button>\n  \u003cspan class=\"generar-fb\" id=\"generar-fb\">\u003c/span>\n\u003c/div>\n\n\u003cdiv class=\"main-layout\">\n  \u003caside class=\"sidebar\">\n    \u003cp class=\"sidebar-label\">Perfiles\u003c/p>\n    \u003ca href=\"/perfil/simperfilx\" class=\"nav-perfil activo\" data-perfil=\"simperfilx\">SIMPERFILX\u003cspan class=\"badge-activo\">activo\u003c/span>\u003c/a>\n    \u003cdiv class=\"sidebar-footer\">\n      \n\u003cdiv class=\"nuevo-perfil-wrap\">\n  \u003cbutton class=\"nuevo-perfil-btn\" onclick=\"toggleNuevo()\">+ Nuevo perfil\u003c/button>\n  \u003cdiv id=\"nuevo-perfil-form\" style=\"display:none; margin-top:.75rem;\">\n    \u003cinput type=\"text\" id=\"nuevo-nombre\" placeholder=\"ej: 2eso, bachillerato...\"\n           style=\"padding:.6rem .8rem; border:1.5px solid var(--border); width:100%; margin-bottom:.5rem; font-size:.9rem; background:var(--paper); color:var(--ink); outline:none;\">\n    \u003cbutton class=\"nuevo-perfil-crear\" onclick=\"crearPerfil()\">Crear\u003c/button>\n    \u003cspan class=\"fb\" id=\"fb-perfil\">\u003c/span>\n  \u003c/div>\n  \u003ca href=\"/importar\" class=\"nuevo-perfil-btn\"\n     style=\"display:block; text-align:center; margin-top:.5rem;\">&#8681; Importar .txt\u003c/a>\n\u003c/div>\n\u003cscript>\nfunction toggleNuevo() {\n  const f = document.getElementById('nuevo-perfil-form');\n  f.style.display = f.style.display === 'none' ? 'block' : 'none';\n}\nasync function crearPerfil() {\n  const nombre = document.getElementById('nuevo-nombre').value.trim();\n  const fb = document.getElementById('fb-perfil');\n  if (!nombre) { fb.textContent='Escribe un nombre.'; fb.className='fb err'; return; }\n  const r = await fetch('/api/nuevo_perfil', {\n    method:'POST', headers:{'Content-Type':'application/json'},\n    body: JSON.stringify({nombre})\n  });\n  const d = await r.json();\n  if (d.ok) { parent.__sim.recargar(); }\n  else { fb.textContent = d.error; fb.className='fb err'; }\n}\n\u003c/script>\n    \u003c/div>\n  \u003c/aside>\n\n  \u003cdiv class=\"contenido\">\n    \u003cdiv class=\"tabs\">\u003ca href=\"/perfil/simperfilx/detonantes\" class=\"tab \">\n              \u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cpolygon points=\"13,2 3,14 12,14 11,22 21,10 12,10\"/>\u003c/svg>\u003cspan>Detonantes\u003c/span>\n              \u003cspan class=\"tab-count\">0\u003c/span>\n            \u003c/a>\u003ca href=\"/perfil/simperfilx/protagonistas\" class=\"tab \">\n              \u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003ccircle cx=\"12\" cy=\"8\" r=\"4\"/>\u003cpath d=\"M4 20c0-4 3.6-7 8-7s8 3 8 7\"/>\u003c/svg>\u003cspan>Protagonistas\u003c/span>\n              \u003cspan class=\"tab-count\">0\u003c/span>\n            \u003c/a>\u003ca href=\"/perfil/simperfilx/conflictos\" class=\"tab activo\">\n              \u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cpath d=\"M12 9v4m0 4h.01M10.3 3.6L2.2 17A2 2 0 004 20h16a2 2 0 001.8-2.9L13.8 3.6a2 2 0 00-3.5 0z\"/>\u003c/svg>\u003cspan>Conflictos\u003c/span>\n              \u003cspan class=\"tab-count\">0\u003c/span>\n            \u003c/a>\u003c/div>\n    \n\u003cdiv class=\"premisas-card\">\n  \u003cdiv class=\"premisas-header\">\n    \u003ch2 class=\"premisas-title serif\">Conflictos\u003cspan class=\"muted\" style=\"font-weight:400;font-size:.9em\"> · SIMPERFILX\u003c/span>\u003c/h2>\n    \u003cdiv class=\"premisas-head-right\">\n      \u003ca class=\"imp-link\" href=\"/importar?perfil=simperfilx\">&#8681; Importar .txt\u003c/a>\n      \u003cspan class=\"premisas-total\">1 premisas\u003c/span>\n    \u003c/div>\n  \u003c/div>\n  \u003cul class=\"premisas-lista\">\u003cli class=\"premisa-item\" id=\"p0\">\n              \u003cspan class=\"premisa-num\">1\u003c/span>\n              \u003cspan class=\"premisa-texto\">SIMPREMISAX\u003c/span>\n              \u003cbutton class=\"premisa-del\" onclick=\"borrar(0)\" title=\"Borrar esta premisa\">\n                \u003csvg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\">\u003cline x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"/>\u003cline x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"/>\u003c/svg>\n              \u003c/button>\n            \u003c/li>\u003c/ul>\n  \u003cdiv class=\"anadir-area\">\n    \u003cp class=\"anadir-label\">Añadir nueva premisa\u003c/p>\n    \u003ctextarea id=\"nueva-premisa\" rows=\"3\"\n      placeholder=\"Escribe aquí la nueva premisa y pulsa Añadir...\">\u003c/textarea>\n    \u003cdiv class=\"anadir-actions\">\n      \u003cbutton class=\"anadir-btn\" onclick=\"anadir()\">+ Añadir\u003c/button>\n      \u003cspan class=\"fb\" id=\"fb\">\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cscript>\nasync function anadir() {\n  const ta = document.getElementById('nueva-premisa');\n  const fb = document.getElementById('fb');\n  const texto = ta.value.trim();\n  if (!texto) { fb.textContent = 'Escribe algo primero.'; fb.className='fb err'; return; }\n  const r = await fetch('/api/anadir_premisa', {\n    method: 'POST', headers: {'Content-Type':'application/json'},\n    body: JSON.stringify({perfil: 'simperfilx', tipo: 'conflictos', texto})\n  });\n  const d = await r.json();\n  if (d.ok) {\n    fb.textContent = 'Añadida (' + d.total + ' en total)';\n    fb.className = 'fb ok';\n    ta.value = '';\n    setTimeout(() => parent.__sim.recargar(), 800);\n  } else {\n    fb.textContent = d.error;\n    fb.className = 'fb err';\n  }\n}\nasync function borrar(i) {\n  if (!confirm('¿Borrar esta premisa?')) return;\n  const r = await fetch('/api/borrar_premisa', {\n    method: 'POST', headers: {'Content-Type':'application/json'},\n    body: JSON.stringify({perfil: 'simperfilx', tipo: 'conflictos', indice: i})\n  });\n  const d = await r.json();\n  if (d.ok) parent.__sim.recargar();\n}\n\u003c/script>\n  \u003c/div>\n\u003c/div>\n\u003cdiv class=\"lamina\" id=\"lamina\" hidden onclick=\"cerrarLamina(event)\">\n  \u003carticle class=\"lamina-hoja\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"lamina-texto\">\n    \u003cp class=\"lamina-cabecera\" id=\"lamina-cabecera\">Premisa\u003c/p>\n    \u003cspan class=\"lamina-comilla\" aria-hidden=\"true\">&ldquo;\u003c/span>\n    \u003cp class=\"lamina-texto\" id=\"lamina-texto\">\u003c/p>\n    \u003cdiv class=\"lamina-orla\" aria-hidden=\"true\">&#10086;\u003c/div>\n    \u003cdiv class=\"lamina-acciones\">\n      \u003cbutton class=\"lamina-otra\" id=\"lamina-otra\" onclick=\"otraPremisa()\">Otra premisa\u003c/button>\n      \u003cbutton class=\"lamina-cerrar\" onclick=\"cerrarLamina()\">Cerrar\u003c/button>\n    \u003c/div>\n  \u003c/article>\n\u003c/div>\n\u003cscript>\nvar _volTimer = null;\nfunction debounceVol(v) {\n  document.getElementById('vol-display').textContent = Math.round(v) + '%';\n  clearTimeout(_volTimer);\n  _volTimer = setTimeout(() => setVol(v), 400);\n}\nasync function setVol(v) {\n  await fetch('/api/guardar_volumen', {\n    method:'POST', headers:{'Content-Type':'application/json'},\n    body: JSON.stringify({volumen: parseInt(v)})\n  });\n}\nvar _premisaId = __SIM_PREMISA_ID__;\n\n// ── Lámina de la premisa ──────────────────────────────────────────────────\n// Se pregunta al servidor solo con el panel visible. Lo que se genere con el\n// móvil bloqueado o en otra pestaña no salta al volver: se toma como visto.\nvar _sondeo = null;\nasync function consultarPremisa(mostrar) {\n  try {\n    const r = await fetch('/api/ultima_premisa', {cache: 'no-store'});\n    if (!r.ok) return;\n    const d = await r.json();          // sesión caducada → HTML → salta al catch\n    if (d.id > _premisaId) {\n      _premisaId = d.id;\n      if (mostrar && d.texto) mostrarLamina(d);\n    }\n  } catch (e) {}\n}\nfunction arrancarSondeo() {\n  if (!_sondeo) _sondeo = setInterval(() => consultarPremisa(true), 2500);\n}\nfunction pararSondeo() { clearInterval(_sondeo); _sondeo = null; }\ndocument.addEventListener('visibilitychange', () => {\n  if (document.visibilityState === 'visible') {\n    consultarPremisa(false).then(arrancarSondeo);\n  } else {\n    pararSondeo();\n  }\n});\nif (document.visibilityState === 'visible') arrancarSondeo();\n\nfunction mostrarLamina(d) {\n  const lam = document.getElementById('lamina');\n  const txt = document.getElementById('lamina-texto');\n  lam.classList.toggle('aviso', d.tipo === 'aviso');\n  document.getElementById('lamina-cabecera').textContent =\n    d.tipo === 'aviso' ? 'Aviso' : 'Premisa' + (d.perfil ? ' · ' + d.perfil : '');\n  txt.textContent = d.texto;\n  // Reinicia la animación del texto si la lámina ya estaba abierta\n  txt.style.animation = 'none'; void txt.offsetWidth; txt.style.animation = '';\n  const otra = document.getElementById('lamina-otra');\n  otra.disabled = false; otra.textContent = 'Otra premisa';\n  lam.hidden = false;\n}\nfunction cerrarLamina(ev) {\n  // Un toque en el fondo cierra; dentro de la hoja, no\n  if (ev && ev.target !== ev.currentTarget) return;\n  document.getElementById('lamina').hidden = true;\n}\nfunction otraPremisa() {\n  const otra = document.getElementById('lamina-otra');\n  otra.disabled = true; otra.textContent = 'Generando…';\n  generarPremisa();\n  setTimeout(() => { otra.disabled = false; otra.textContent = 'Otra premisa'; }, 4000);\n}\ndocument.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrarLamina(); });\n\nasync function generarPremisa() {\n  const btn = document.getElementById('generar-btn');\n  const fb  = document.getElementById('generar-fb');\n  btn.disabled = true;\n  fb.textContent = 'Generando...';\n  try {\n    const r = await fetch('/api/generar', {method:'POST',\n      headers:{'Content-Type':'application/json'}, body:'{}'});\n    const d = await r.json();\n    if (d.ok) {\n      fb.textContent = 'Premisa enviada a las salidas activas.';\n      setTimeout(() => consultarPremisa(true), 400);\n      setTimeout(() => consultarPremisa(true), 1200);\n    } else {\n      fb.textContent = d.error || 'Error al generar.';\n    }\n  } catch(e) {\n    fb.textContent = 'Error de conexión.';\n  }\n  setTimeout(() => {\n    btn.disabled = false;\n    fb.textContent = '';\n  }, 3000);\n}\n// Perfil confirmado por la caja. El selector ya muestra el nuevo; la etiqueta\n// «activo» de la barra lateral se movía solo al recargar la página.\nvar _perfilActivo = (document.getElementById('perfil-sel') || {}).value;\nasync function cambiarPerfil(p) {\n  const sel = document.getElementById('perfil-sel');\n  let d = {ok: false};\n  try {\n    const r = await fetch('/api/cambiar_perfil', {\n      method:'POST', headers:{'Content-Type':'application/json'},\n      body: JSON.stringify({perfil: p})\n    });\n    d = await r.json();\n  } catch (e) {\n    d.error = 'Sin respuesta de la caja';\n  }\n  if (!d.ok) {\n    if (sel) sel.value = _perfilActivo;\n    alert('No se ha podido cambiar el perfil activo' + (d.error ? ': ' + d.error : '.'));\n    return;\n  }\n  _perfilActivo = p;\n  document.querySelectorAll('.nav-perfil .badge-activo').forEach(b => b.remove());\n  const enlace = document.querySelector('.nav-perfil[data-perfil=\"' + CSS.escape(p) + '\"]');\n  if (enlace) {\n    const b = document.createElement('span');\n    b.className = 'badge-activo';\n    b.textContent = 'activo';\n    enlace.appendChild(b);\n  }\n  if (sel) {\n    sel.style.outline = '2px solid #9be6a8';\n    setTimeout(() => sel.style.outline = '', 1400);\n  }\n}\nasync function confirmarApagado() {\n  if (!confirm('¿Apagar el dispositivo?')) return;\n  const btn = document.querySelector('.hlink-apagar');\n  btn.disabled = true;\n  btn.textContent = 'Apagando...';\n  await fetch('/api/apagar', {method:'POST',\n    headers:{'Content-Type':'application/json'}, body:'{}'});\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>"}};
const TIPOS = D.tipos;
const PH = D.ph, PHU = D.ph.toUpperCase();

let S, rutaActual = '/';
function inicial() {
  S = {
    logged: false,
    setup: D.config.setup_completado,
    pin: D.config.pin,
    activo: D.config.perfil_activo,
    volumen: D.config.hardware.audio.volumen,
    buscar: D.config.buscar_actualizaciones,
    perfiles: JSON.parse(JSON.stringify(D.perfiles)),
    ultima: {id: 0, texto: null, perfil: null, tipo: 'premisa'},
    pools: null,
  };
  document.getElementById('pin').textContent = S.pin;
}

// ── Generador (misma lógica que firmware/modules/generador.py) ───────
function barajar(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function limpiar(l) { return l.trim().replace(/[.,;: ]+$/, ''); }
function pools() {
  // La caja carga y baraja las listas al arrancar y al cambiar de perfil.
  // Aquí también se recargan al editar premisas, para que lo añadido pueda salir.
  if (!S.pools || S.pools.perfil !== S.activo) {
    const p = S.perfiles[S.activo] || {};
    S.pools = {perfil: S.activo};
    TIPOS.forEach(t => S.pools[t] = barajar((p[t] || []).map(limpiar).filter(Boolean)));
  }
  return S.pools;
}
function generar() {
  const P = pools();
  const id = Math.max(S.ultima.id + 1, Date.now());
  if (!(P.detonantes.length && P.protagonistas.length && P.conflictos.length)) {
    return {id, texto: D.config.mensaje_sin_frases, perfil: null, tipo: 'aviso'};
  }
  const d = P.detonantes.pop(), p = P.protagonistas.pop(), c = P.conflictos.pop();
  return {id, texto: `${d}, ${p} ${c}.`, perfil: S.activo.toUpperCase(), tipo: 'premisa'};
}

// Nombre de perfil → carpeta (firmware/modules/importador.py › slug_perfil)
function slug(nombre) {
  let s = (nombre || '').trim().normalize('NFKD').replace(/\p{M}/gu, '').toLowerCase();
  s = s.replace(/[\s./\\]+/g, '_').replace(/[^a-z0-9_-]/g, '')
       .replace(/_+/g, '_').replace(/^[_-]+|[_-]+$/g, '');
  return s.slice(0, 32);
}

// ── Avisos del simulador ─────────────────────────────────────────────
let avisoTimer = null;
function aviso(texto) {
  const a = document.getElementById('aviso');
  a.textContent = texto;
  a.hidden = false;
  clearTimeout(avisoTimer);
  avisoTimer = setTimeout(() => { a.hidden = true; }, 6000);
}

// ── API JSON simulada (lo que en la caja atiende Flask) ──────────────
function json(obj, status = 200) {
  return new Response(JSON.stringify(obj), {status, headers: {'Content-Type': 'application/json'}});
}
async function fetchSim(url, o) {
  const path = url.split('?')[0];
  let body = {};
  try { body = o.body ? JSON.parse(o.body) : {}; } catch (e) {}
  if (!S.logged) {
    // Sesión caducada: la caja devuelve el HTML del login y r.json() falla
    return new Response('<!DOCTYPE html>', {status: 200, headers: {'Content-Type': 'text/html'}});
  }
  switch (path) {
    case '/api/generar':
      S.ultima = generar();
      return json({ok: true});
    case '/api/ultima_premisa':
      return json(S.ultima);
    case '/api/anadir_premisa': {
      const {perfil, tipo} = body, texto = (body.texto || '').trim();
      if (!perfil || !tipo || !texto) return json({ok: false, error: 'Datos incompletos'});
      if (!TIPOS.includes(tipo)) return json({ok: false, error: 'Tipo no válido'});
      const P = S.perfiles[perfil];
      if (!P) return json({ok: false, error: 'Perfil no encontrado'});
      if (P[tipo].includes(texto)) return json({ok: false, error: 'Esa premisa ya existe'});
      P[tipo].push(texto);
      S.pools = null;
      return json({ok: true, total: P[tipo].length});
    }
    case '/api/borrar_premisa': {
      const {perfil, tipo, indice} = body;
      if (perfil == null || tipo == null || indice == null) return json({ok: false, error: 'Datos incompletos'});
      if (!TIPOS.includes(tipo)) return json({ok: false, error: 'Tipo no válido'});
      const P = S.perfiles[perfil];
      if (!P) return json({ok: false, error: 'Perfil no encontrado'});
      if (indice < 0 || indice >= P[tipo].length) return json({ok: false, error: 'Índice fuera de rango'});
      P[tipo].splice(indice, 1);
      S.pools = null;
      return json({ok: true, total: P[tipo].length});
    }
    case '/api/cambiar_perfil':
      if (!S.perfiles[body.perfil]) return json({ok: false, error: 'Perfil no encontrado'});
      S.activo = body.perfil;
      return json({ok: true});
    case '/api/nuevo_perfil': {
      const n = slug(body.nombre);
      if (!n) return json({ok: false, error: 'Nombre no válido: usa letras o números'});
      if (S.perfiles[n]) return json({ok: false, error: 'Ya existe ese perfil'});
      S.perfiles[n] = {detonantes: [], protagonistas: [], conflictos: []};
      return json({ok: true, perfil: n});
    }
    case '/api/guardar_volumen': {
      const v = Math.max(0, Math.min(100, parseInt(body.volumen) || 0));
      S.volumen = v;
      return json({ok: true, volumen: v});
    }
    case '/api/guardar_hardware':
      return json({ok: true});
    case '/api/estado':
      return json({perfil_activo: S.activo, setup_completado: S.setup,
                   hardware: {eink: true, impresora: true, audio: true}});
    case '/api/reset_fabrica':
      S.setup = false; S.pin = D.config.pin; S.logged = false;
      document.getElementById('pin').textContent = S.pin;
      aviso('Reset de fábrica: la caja vuelve al primer arranque, con el PIN 1234.');
      return json({ok: true});
    case '/api/apagar':
      aviso('En la caja real, el dispositivo se apagaría ahora. Pulsa «Empezar de nuevo» para seguir.');
      return json({ok: true});
    case '/api/version':
      return json({version: D.version, fase: null});
  }
  return json({ok: false, error: 'Ruta desconocida en el simulador: ' + path}, 404);
}

// ── Rutas (lo que en la caja decide cada @app.route) ─────────────────
function vista(path) {
  const [p, q] = path.split('?');
  const qs = new URLSearchParams(q || '');
  if (p === '/logout') { S.logged = false; }
  if (!S.logged || p === '/login' || p === '/logout') return {pag: S.setup ? 'login' : 'login_1'};
  if (!S.setup) return {pag: 'setup_inicial'};      // primer arranque: todo lleva al setup
  if (p === '/setup') return {pag: 'setup'};
  if (p === '/importar') return {pag: 'importar', perfil: qs.get('perfil') || S.activo};
  if (p === '/actualizar') return {pag: 'actualizar'};
  const seg = p.split('/').filter(Boolean);
  if (seg[0] === 'perfil' && S.perfiles[seg[1]]) {
    if (!seg[2]) return {pag: 'perfil', perfil: seg[1]};
    if (TIPOS.includes(seg[2])) return {pag: 'perfil_' + seg[2], perfil: seg[1], tipo: seg[2]};
  }
  return {pag: 'panel'};
}

// ── Adaptación de las páginas al estado ──────────────────────────────
function nombresPerfiles() { return Object.keys(S.perfiles).sort(); }

function patchPanel(doc, sel) {
  // Barra lateral de perfiles: se parte del enlace del perfil comodín
  const nav = doc.querySelector('.nav-perfil');
  const badge = nav.querySelector('.badge-activo');
  nombresPerfiles().forEach(p => {
    const a = nav.cloneNode(false);
    a.setAttribute('href', '/perfil/' + p);
    a.setAttribute('data-perfil', p);
    a.className = 'nav-perfil' + (p === sel ? ' activo' : '');
    a.textContent = p.toUpperCase();
    if (p === S.activo) a.appendChild(badge.cloneNode(true));
    nav.parentNode.insertBefore(a, nav);
  });
  nav.remove();
  // Selector de perfil activo
  const s = doc.getElementById('perfil-sel');
  s.innerHTML = '';
  nombresPerfiles().forEach(p => {
    const o = doc.createElement('option');
    o.setAttribute('value', p);
    o.textContent = p.toUpperCase();
    if (p === S.activo) o.setAttribute('selected', '');
    s.appendChild(o);
  });
  // Volumen
  const vol = doc.getElementById('vol-slider');
  if (vol) { vol.setAttribute('value', S.volumen); doc.getElementById('vol-display').textContent = S.volumen + '%'; }
}

function patchTabs(doc, perfil) {
  doc.querySelectorAll('.tab').forEach(tab => {
    const tipo = tab.getAttribute('href').split('/').pop();
    tab.querySelector('.tab-count').textContent = (S.perfiles[perfil][tipo] || []).length;
  });
}

function patchPremisas(doc, perfil, tipo) {
  const lista = S.perfiles[perfil][tipo];
  const ul = doc.querySelector('.premisas-lista');
  const molde = ul.querySelector('.premisa-item');
  ul.innerHTML = '';
  lista.forEach((txt, i) => {
    const li = molde.cloneNode(true);
    li.id = 'p' + i;
    li.querySelector('.premisa-num').textContent = i + 1;
    li.querySelector('.premisa-texto').textContent = txt;
    li.querySelector('.premisa-del').setAttribute('onclick', 'borrar(' + i + ')');
    ul.appendChild(li);
  });
  if (!lista.length) {
    const li = doc.createElement('li');
    li.className = 'premisa-vacia';
    li.textContent = 'Sin premisas. ¡Añade la primera abajo!';
    ul.appendChild(li);
  }
  doc.querySelector('.premisas-total').textContent = lista.length + ' premisas';
}

function patchImportar(doc, pre) {
  const s = doc.getElementById('imp-perfil');
  s.innerHTML = '';
  nombresPerfiles().forEach(p => {
    const o = doc.createElement('option');
    o.setAttribute('value', p);
    o.textContent = p.toUpperCase() + (p === S.activo ? ' — perfil activo' : '');
    if (p === pre) o.setAttribute('selected', '');
    s.appendChild(o);
  });
}

function patchActualizar(doc) {
  const c = doc.querySelector('input[name=buscar]');
  if (S.buscar) c.setAttribute('checked', ''); else c.removeAttribute('checked');
}

function patchSetup(doc) {
  const v = doc.getElementById('volumen');
  if (v) { v.setAttribute('value', S.volumen); doc.getElementById('vol-num').textContent = S.volumen; }
}

function mostrar(v) {
  let html = D.paginas[v.pag];
  if (v.perfil) html = html.split(PH).join(v.perfil).split(PHU).join(v.perfil.toUpperCase());
  html = html.replace('__SIM_PREMISA_ID__', String(S.ultima.id))
             .replace('__SIM_FONTS__', () => D.fuentes);
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const pag = v.pag;
  if (pag === 'panel' || pag.startsWith('perfil')) patchPanel(doc, v.perfil || null);
  if (pag.startsWith('perfil')) patchTabs(doc, v.perfil);
  if (pag.startsWith('perfil_')) patchPremisas(doc, v.perfil, v.tipo);
  if (pag === 'importar') patchImportar(doc, v.perfil);
  if (pag.startsWith('actualizar')) patchActualizar(doc);
  if (pag.startsWith('setup')) patchSetup(doc);
  const salida = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
  if (salida.includes(PH)) console.warn('Simulador: queda el perfil comodín en', pag);
  document.getElementById('marco').srcdoc = salida;
}

function render(path) { rutaActual = path; mostrar(vista(path)); }
function ir(path) {
  if (location.hash === '#' + path) render(path); else location.hash = path;
}
window.addEventListener('hashchange', () => render(location.hash.slice(1) || '/'));

// ── Formularios (lo que en la caja atiende cada POST) ────────────────
function formulario(form) {
  const accion = form.getAttribute('action') || '';
  const datos = new FormData(form);
  switch (accion) {
    case '/importar/revisar':
    case '/importar/deshacer':
      return mostrar({pag: 'sim_importar'});
    case '/actualizar/buscar':
      return mostrar({pag: 'actualizar_buscado'});
    case '/actualizar/subir':
    case '/actualizar/instalar':
      return mostrar({pag: 'sim_actualizar'});
    case '/actualizar/ajustes':
      S.buscar = datos.get('buscar') === 'si';
      return ir('/actualizar');
  }
  if (form.querySelector('[name=pin]')) {                       // login
    if (datos.get('pin') === S.pin) { S.logged = true; return ir('/'); }
    return mostrar({pag: S.setup ? 'login_err' : 'login_1_err'});
  }
  if (form.querySelector('[name=placa]')) {                     // setup
    const nueva = datos.get('nueva_pass') || '', repite = datos.get('repite_pass') || '';
    if (nueva !== repite) return aviso('Las dos contraseñas no coinciden. Vuelve a escribirlas.');
    const pin = (datos.get('nuevo_pin') || '').trim();
    if (/^\d{4,8}$/.test(pin)) { S.pin = pin; document.getElementById('pin').textContent = pin; }
    if (datos.get('volumen')) S.volumen = Math.max(0, Math.min(100, parseInt(datos.get('volumen'))));
    const primera = !S.setup;
    S.setup = true;
    aviso(primera
      ? 'Configuración guardada. En la caja real se reinicia el servicio y la impresora saca el ticket de bienvenida.'
      : 'Guardado. En la caja real, el hardware se activa o desactiva al reiniciar el servicio; aquí el panel no cambia.');
    return ir('/');
  }
  aviso('Este formulario no hace nada en el simulador.');
}

// ── Arranque ─────────────────────────────────────────────────────────
window.__sim = {fetch: fetchSim, ir, recargar: () => render(rutaActual), formulario};
document.getElementById('reiniciar').addEventListener('click', () => { inicial(); ir('/'); });
inicial();
render(location.hash.slice(1) || '/');
</script>
</body>
